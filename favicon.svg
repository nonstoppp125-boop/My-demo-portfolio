<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="body" cx=".35" cy=".28" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#6eeaff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#0b3a4a"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#35d7ee" stop-opacity=".45"/>
      <stop offset="1" stop-color="#35d7ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="32" cy="32" r="31" fill="url(#glow)"/>

  <!-- glass bubble -->
  <circle cx="32" cy="32" r="27" fill="url(#body)" stroke="#9ff" stroke-opacity=".75" stroke-width="1.5"/>

  <!-- highlight -->
  <path d="M15 24a19 19 0 0 1 18-10" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 46a20 20 0 0 1-9 6" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>

  <!-- eyes -->
  <rect x="21" y="26" width="6" height="14" rx="3" fill="#06202a"/>
  <rect x="37" y="26" width="6" height="14" rx="3" fill="#06202a"/>

  <!-- cheeks -->
  <ellipse cx="18" cy="42" rx="4" ry="2.4" fill="#ff7ab8" opacity=".3"/>
  <ellipse cx="46" cy="42" rx="4" ry="2.4" fill="#ff7ab8" opacity=".3"/>
</svg>
