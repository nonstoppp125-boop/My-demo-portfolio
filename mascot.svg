    <path d="M178 221C163 188 177 152 205 132C225 108 249 107 271 119C295 97 328 111 342 130C365 124 389 145 392 170C410 187 404 215 389 234C378 214 365 201 347 196C329 190 315 173 311 155C294 185 270 196 245 195C222 194 203 208 196 235L190 264Z"
