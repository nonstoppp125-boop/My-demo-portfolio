    <path d="M362 151C387 173 394 206 388 234"
      stroke="#FFFFFF" stroke-opacity=".62" stroke-width="5" stroke-linecap="round"/>
    <path d="M213 324C227 359 252 380 285 386"
      stroke="#FFFFFF" stroke-opacity=".62" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="236" cy="235" rx="27" ry="54" fill="#FFFFFF" fill-opacity=".08"/>
    <ellipse cx="363" cy="269" rx="20" ry="52" fill="#A3F5EA" fill-opacity=".12"/>
  </g>

  <!-- Front wavy glass hair -->
