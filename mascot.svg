<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="body" cx=".35" cy=".3" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset=".45" stop-color="#99ffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#112233" stop-opacity=".6"/>
    </radialGradient>
    <radialGradient id="rim" cx=".5" cy=".5" r=".5">
      <stop offset=".85" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .eye { fill: var(--accent, #35d7ee); transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .mini { animation: bob 5s ease-in-out infinite alternate; }
    .mini.b { animation-delay: -2s; }
    @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
    @keyframes bob { to { transform: translateY(-8px); } }
    @media (prefers-reduced-motion: reduce) { .eye, .mini { animation: none; } }
  </style>

  <!-- ground shadow -->
  <ellipse cx="100" cy="190" rx="46" ry="6" fill="#000" opacity=".35" filter="url(#soft)"/>

  <!-- body -->
  <circle cx="100" cy="100" r="78" fill="url(#body)" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="78" fill="url(#rim)"/>

  <!-- highlights -->
  <path d="M50 66a60 60 0 0 1 58-32" stroke="#fff" stroke-opacity=".8" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M62 52a48 48 0 0 1 20-12" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M140 150a62 62 0 0 0 22-40" stroke="#fff" stroke-opacity=".28" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- eyes -->
  <g id="eyes" filter="url(#glow)">
    <rect class="eye" x="70" y="84" width="14" height="34" rx="7"/>
    <rect class="eye" x="116" y="84" width="14" height="34" rx="7"/>
  </g>

  <!-- cheeks + smile -->
  <ellipse cx="58" cy="124" rx="10" ry="6" fill="#ff7ab8" opacity=".28"/>
  <ellipse cx="142" cy="124" rx="10" ry="6" fill="#ff7ab8" opacity=".28"/>
  <path d="M90 128q10 8 20 0" stroke="var(--accent, #35d7ee)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".8"/>

  <!-- tiny floating bubbles -->
  <g class="mini">
    <circle cx="172" cy="42" r="9" fill="url(#body)" stroke="#fff" stroke-opacity=".5"/>
    <circle cx="169" cy="39" r="2.5" fill="#fff" opacity=".8"/>
  </g>
  <g class="mini b">
    <circle cx="28" cy="70" r="6" fill="url(#body)" stroke="#fff" stroke-opacity=".5"/>
    <circle cx="26" cy="68" r="1.8" fill="#fff" opacity=".8"/>
  </g>
</svg>
