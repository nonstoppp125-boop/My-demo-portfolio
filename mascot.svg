    <path d="M273 497H328" stroke="#567984" stroke-width="3" stroke-linecap="round"/>
    <circle cx="300" cy="418" r="2" fill="#244B57"/>
  </g>

  <!-- Floating coding speech bubble -->
  <g id="coding-bubble">
    <path d="M414 350C414 336 425 325 439 325H485C499 325 510 336 510 350V376C510 390 499 401 485 401H458L444 414V401H439C425 401 414 390 414 376Z"
      fill="url(#bubbleGlass)" stroke="#D9FFFA" stroke-width="3"/>
    <path d="M435 359L445 368L435 377M462 377L472 359"
      stroke="#276A70" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M430 340Q438 334 446 337" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating glass light bulb -->
  <g id="floating-light">
    <circle cx="130" cy="365" r="42" fill="url(#orbGlow)" opacity=".85"/>
    <path d="M113 361C105 347 111 329 126 325C141 321 153 333 151 347C150 356 143 360 140 369H122C120 365 117 363 113 361Z"
      fill="url(#bubbleGlass)" stroke="#F4FFFD" stroke-width="3"/>
    <path d="M122 370H140M123 377H139M126 383H136"
      stroke="#C8FFF5" stroke-width="3" stroke-linecap="round"/>
    <path d="M123 339Q128 332 136 335" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <path d="M131 311V303M104 326L98 320M158 326L164 320"
      stroke="#B9FFF4" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Ambient sparkles -->
  <g id="sparkles" fill="#F2FFFE">
    <path d="M449 181L453 193L465 197L453 201L449 213L445 201L433 197L445 193Z" opacity=".85"/>
    <path d="M153 286L156 294L164 297L156 300L153 308L150 300L142 297L150 294Z" opacity=".78"/>
    <path d="M408 455L411 462L418 465L411 468L408 475L405 468L398 465L405 462Z" opacity=".8"/>
    <circle cx="171" cy="175" r="3"/>
    <circle cx="427" cy="245" r="3"/>
    <circle cx="390" cy="102" r="3"/>
    <circle cx="190" cy="426" r="2.5"/>
    <circle cx="449" cy="318" r="2.5"/>
  </g>

  <!-- Foreground glass reflections -->
  <path d="M176 459C188 432 205 419 226 413"
    stroke="#FFFFFF" stroke-opacity=".45" stroke-width="3" stroke-linecap="round"/>
  <path d="M371 413C394 421 411 438 421 460"
    stroke="#FFFFFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <path d="M273 391Q299 402 327 390"
    stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3" stroke-linecap="round"/>
</svg>
