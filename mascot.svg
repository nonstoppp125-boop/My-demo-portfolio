    <path d="M181 185C193 145 225 116 260 114C288 104 317 112 336 128"
      stroke="#FFFFFF" stroke-opacity=".84" stroke-width="8" stroke-linecap="round"/>
    <path d="M335 112C369 118 396 145 402 178"
      stroke="#B8FFF3" stroke-opacity=".9" stroke-width="6" stroke-linecap="round"/>
    <path d="M184 217C169 247 181 282 202 294"
      stroke="#FFFFFF" stroke-opacity=".7" stroke-width="5" stroke-linecap="round"/>
    <path d="M395 212C410 238 399 267 383 284"
      stroke="#C7F9FF" stroke-opacity=".84" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Neck -->
  <path d="M264 362L264 415C274 438 324 438 337 414L335 358Z"
    fill="url(#glassBody)" stroke="#DFFFF9" stroke-opacity=".85" stroke-width="3"/>

  <!-- Body and shirt -->
  <g id="body">
    <path d="M245 400C219 402 191 417 178 443C160 475 158 516 171 551C185 580 225 597 300 599C375 597 415 580 429 551C442 516 440 475 422 443C409 417 381 402 355 400L331 419C314 435 286 435 269 419Z"
      fill="url(#shirtGlass)" stroke="#EDFFFC" stroke-width="4"/>
    <path d="M245 402L279 430L300 454L322 430L355 402"
      fill="#F5FFFC" fill-opacity=".68" stroke="#FFFFFF" stroke-opacity=".95" stroke-width="3" stroke-linejoin="round"/>
    <path d="M280 431L300 454L320 431L311 468L300 480L289 468Z"
      fill="url(#tieGlass)" stroke="#DFFFF8" stroke-width="2"/>
    <path d="M300 480L289 468L283 520L300 532L317 520L311 468Z"
      fill="url(#tieGlass)" stroke="#DFFFF8" stroke-width="2"/>
    <path d="M194 457C186 489 190 529 204 549"
      stroke="#FFFFFF" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"/>
    <path d="M407 456C419 487 414 527 400 548"
      stroke="#FFFFFF" stroke-opacity=".66" stroke-width="5" stroke-linecap="round"/>
    <path d="M233 566Q300 585 367 566"
      stroke="#FFFFFF" stroke-opacity=".46" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arms -->
  <g id="arms">
    <path d="M190 441C168 457 155 482 164 504C171 522 194 523 211 509L246 473L228 451Z"
      fill="url(#glassBody)" stroke="#E6FFFC" stroke-width="3"/>
    <path d="M410 441C432 457 445 482 436 504C429 522 406 523 389 509L354 473L372 451Z"
      fill="url(#glassBody)" stroke="#E6FFFC" stroke-width="3"/>
    <path d="M175 481Q179 495 194 498" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
    <path d="M425 481Q421 495 406 498" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Legs, sitting cross-legged -->
  <g id="legs">
    <path d="M214 556C194 566 176 587 187 607C201 632 253 634 285 616L311 600L287 568Z"
      fill="url(#glassBody)" stroke="#E7FFFC" stroke-width="3"/>
    <path d="M386 556C406 566 424 587 413 607C399 632 347 634 315 616L289 600L313 568Z"
      fill="url(#glassBody)" stroke="#E7FFFC" stroke-width="3"/>
    <path d="M208 591C231 603 255 602 275 590"
      stroke="#FFFFFF" stroke-opacity=".68" stroke-width="4" stroke-linecap="round"/>
    <path d="M392 591C369 603 345 602 325 590"
      stroke="#FFFFFF" stroke-opacity=".68" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Shoes -->
  <g id="shoes">
    <path d="M186 602C203 595 225 599 245 609C256 615 263 624 254 631C239 641 207 638 188 629C178 624 178 610 186 602Z"
