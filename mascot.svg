    <path d="M414 602C397 595 375 599 355 609C344 615 337 624 346 631C361 641 393 638 412 629C422 624 422 610 414 602Z"
      fill="url(#shoeGlass)" stroke="#B8FFF5" stroke-width="3"/>
    <path d="M193 617Q218 628 244 622" stroke="#E8FFFC" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
    <path d="M407 617Q382 628 356 622" stroke="#E8FFFC" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Head glass shell -->
  <g id="head">
