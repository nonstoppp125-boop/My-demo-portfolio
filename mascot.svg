<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" fill="none">
  <defs>
    <linearGradient id="glassBody" x1="130" y1="90" x2="450" y2="590" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3FFFC" stop-opacity=".91"/>
      <stop offset=".22" stop-color="#A8F9E6" stop-opacity=".54"/>
      <stop offset=".52" stop-color="#75E7D1" stop-opacity=".27"/>
      <stop offset=".78" stop-color="#A4E9F4" stop-opacity=".48"/>
      <stop offset="1" stop-color="#E7FFFF" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="hairGlass" x1="165" y1="95" x2="420" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".96"/>
      <stop offset=".23" stop-color="#B7FFF0" stop-opacity=".88"/>
      <stop offset=".55" stop-color="#73DCCF" stop-opacity=".74"/>
      <stop offset=".78" stop-color="#B5DFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#F6FFFF" stop-opacity=".96"/>
    </linearGradient>
    <linearGradient id="faceGlass" x1="205" y1="180" x2="397" y2="405" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4FFFC" stop-opacity=".82"/>
      <stop offset=".45" stop-color="#D2FFF5" stop-opacity=".53"/>
      <stop offset="1" stop-color="#80E4D9" stop-opacity=".43"/>
    </linearGradient>
    <linearGradient id="shirtGlass" x1="180" y1="410" x2="420" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".91"/>
      <stop offset=".35" stop-color="#D8FFF7" stop-opacity=".67"/>
      <stop offset=".75" stop-color="#9FE5E7" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F4FFFF" stop-opacity=".87"/>
    </linearGradient>
    <linearGradient id="shoeGlass" x1="205" y1="575" x2="405" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#244D58"/>
      <stop offset=".45" stop-color="#478D94"/>
      <stop offset=".72" stop-color="#173A49"/>
      <stop offset="1" stop-color="#9BF6EA"/>
    </linearGradient>
    <linearGradient id="tieGlass" x1="287" y1="430" x2="322" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2C7880"/>
      <stop offset=".5" stop-color="#16434F"/>
      <stop offset="1" stop-color="#73D7CD"/>
    </linearGradient>
    <radialGradient id="cheekGlow">
      <stop stop-color="#FF9CBF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FF9CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#D9FFF8" stop-opacity=".9"/>
      <stop offset="1" stop-color="#7AEBDD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bubbleGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset=".42" stop-color="#A8F8EB" stop-opacity=".16"/>
      <stop offset="1" stop-color="#B7DFFF" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="laptopMetal" x1="245" y1="405" x2="365" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FFFF"/>
      <stop offset=".35" stop-color="#B8D4D9"/>
      <stop offset=".7" stop-color="#728F9B"/>
      <stop offset="1" stop-color="#E5FFFF"/>
    </linearGradient>
    <filter id="softShadow" x="60" y="50" width="480" height="620" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="mintGlow" x="100" y="50" width="400" height="600" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="eyeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="headClip">
      <path d="M181 211C178 164 207 127 248 119C290 105 348 122 375 153C398 179 405 224 396 270L384 330C374 368 346 395 302 401C256 398 220 375 205 341C192 309 183 261 181 211Z"/>
    </clipPath>
  </defs>

  <!-- Ambient halo -->
  <ellipse cx="300" cy="585" rx="185" ry="34" fill="#8FFFEF" fill-opacity=".14" filter="url(#softShadow)"/>
  <ellipse cx="300" cy="320" rx="175" ry="215" fill="#73E8DB" fill-opacity=".12" filter="url(#mintGlow)"/>

  <!-- Floating glass bubbles -->
  <g id="floating-bubbles" stroke="#E6FFFC" stroke-width="2">
    <circle cx="131" cy="221" r="19" fill="url(#bubbleGlass)" fill-opacity=".8"/>
    <path d="M121 211Q126 205 133 207" stroke-width="3" stroke-linecap="round" opacity=".8"/>
    <circle cx="460" cy="288" r="13" fill="url(#bubbleGlass)" fill-opacity=".72"/>
    <path d="M454 281Q458 277 463 280" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="414" cy="125" r="8" fill="url(#bubbleGlass)"/>
    <circle cx="165" cy="382" r="8" fill="url(#bubbleGlass)"/>
    <circle cx="434" cy="412" r="6" fill="url(#bubbleGlass)"/>
    <circle cx="206" cy="92" r="6" fill="url(#bubbleGlass)"/>
  </g>

  <!-- Hair silhouette behind the head -->
  <g id="hair-back">
    <path d="M172 233C149 189 170 137 203 113C225 82 267 72 294 87C326 67 370 91 388 119C425 141 439 184 421 222L405 276L376 248L211 268L187 292Z"
