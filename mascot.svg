<svg xmlns="http://w3.org" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Rich Sci-Fi Gradient Maps -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.18)" />
      <stop offset="60%" stop-color="rgba(255, 255, 255, 0.03)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.12)" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Outer Glow Defs -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Jetpack / Energy Rings Behind Body -->
  <g filter="url(#neonGlow)">
    <circle cx="200" cy="270" r="65" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.6"/>
    <ellipse cx="200" cy="340" rx="40" ry="12" fill="#00f2fe" opacity="0.4" filter="url(#neonGlow)"/>
  </g>

  <!-- Main Levitating Floating Platform Capsule Base -->
  <path d="M 120 320 Q 200 360 280 320 Q 200 330 120 320 Z" fill="url(#accentGrad)" opacity="0.7"/>

  <!-- Left Secondary Support Arm -->
  <path d="M 100 210 Q 70 230 90 260" fill="none" stroke="url(#bodyGrad)" stroke-width="24" stroke-linecap="round"/>

  <!-- Waving Interactive Right Arm (Targeted by JS Animation Matrix) -->
  <g id="mascotWavingArm">
    <path d="M 300 210 Q 340 200 350 160" fill="none" stroke="url(#bodyGrad)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="350" cy="155" r="14" fill="url(#accentGrad)"/>
  </g>

  <!-- Central Translucent Engineered Glass Torso -->
  <rect x="110" y="160" width="180" height="130" rx="60" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <!-- Core Internal Energy Light Node -->
  <circle cx="200" cy="220" r="22" fill="url(#visorGrad)" opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Head Sphere Construction with Frosted Properties -->
  <circle cx="200" cy="110" r="75" fill="url(#bodyGrad)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Cybernetic Hologram Visor (Face Layer) -->
  <rect x="145" y="80" width="110" height="45" rx="20" fill="url(#visorGrad)" filter="url(#neonGlow)" opacity="0.95"/>

  <!-- Dynamic Tracker Pupils (Targeted by JS Mouse Position Vector Offset) -->
  <g fill="#05050d">
    <!-- Left Eye Pupil Layer -->
    <circle class="mascot-eye-pupil" cx="180" cy="102" r="7" style="transition: transform 0.1s ease-out;"/>
    <!-- Right Eye Pupil Layer -->
    <circle class="mascot-eye-pupil" cx="220" cy="102" r="7" style="transition: transform 0.1s ease-out;"/>
  </g>

  <!-- Antenna Nodes for Deep Network Matrix Synchronization -->
  <line x1="200" y1="35" x2="200" y2="0" stroke="url(#accentGrad)" stroke-width="5" filter="url(#neonGlow)"/>
  <circle cx="200" cy="0" r="8" fill="#ffffff" filter="url(#neonGlow)"/>
</svg>
