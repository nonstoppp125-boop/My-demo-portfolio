    <path d="M191 190C199 160 224 139 249 139C270 137 281 151 279 170C276 187 257 199 238 199"
      stroke="#FFFFFF" stroke-opacity=".94" stroke-width="8" stroke-linecap="round"/>
    <path d="M279 130C296 120 316 128 322 147C328 164 318 184 302 192"
      stroke="#FFFFFF" stroke-opacity=".83" stroke-width="7" stroke-linecap="round"/>
    <path d="M329 140C351 143 369 161 370 181C371 196 362 209 351 216"
      stroke="#BFFFF4" stroke-opacity=".95" stroke-width="6" stroke-linecap="round"/>
    <path d="M204 216C215 197 232 188 250 187"
      stroke="#9FEADD" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    <path d="M186 225C180 245 188 263 202 271"
      stroke="#FFFFFF" stroke-opacity=".76" stroke-width="5" stroke-linecap="round"/>
    <path d="M386 213C391 229 386 245 376 256"
      stroke="#FFFFFF" stroke-opacity=".72" stroke-width="5" stroke-linecap="round"/>
    <circle cx="223" cy="155" r="5" fill="#FFFFFF"/>
    <circle cx="341" cy="153" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Face details -->
  <g id="face">
    <!-- Soft cheek glass tint -->
    <ellipse cx="230" cy="288" rx="35" ry="25" fill="url(#cheekGlow)"/>
    <ellipse cx="369" cy="288" rx="35" ry="25" fill="url(#cheekGlow)"/>

    <!-- Eyebrows -->
    <path d="M229 246Q246 236 261 245" stroke="#28545A" stroke-opacity=".78" stroke-width="4" stroke-linecap="round"/>
    <path d="M337 245Q352 236 369 246" stroke="#28545A" stroke-opacity=".78" stroke-width="4" stroke-linecap="round"/>

    <!-- Expressive dark oval eyes -->
    <g id="eyes">
      <ellipse cx="246" cy="267" rx="12" ry="17" fill="#12343C"/>
      <ellipse cx="352" cy="267" rx="12" ry="17" fill="#12343C"/>
      <ellipse cx="250" cy="261" rx="4" ry="6" fill="#FFFFFF"/>
      <ellipse cx="356" cy="261" rx="4" ry="6" fill="#FFFFFF"/>
      <circle cx="240" cy="273" r="2.5" fill="#9DFFF1"/>
      <circle cx="346" cy="273" r="2.5" fill="#9DFFF1"/>
    </g>

    <!-- Small smiling mouth -->
    <g id="mouth">
      <path d="M281 302Q300 319 319 302" stroke="#24575B" stroke-width="4" stroke-linecap="round"/>
      <path d="M286 303Q300 311 314 303" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Blush highlights -->
    <g id="blush" fill="#FF9BBE" fill-opacity=".78">
      <ellipse cx="230" cy="288" rx="13" ry="5"/>
      <ellipse cx="369" cy="288" rx="13" ry="5"/>
    </g>

    <!-- Tiny glass freckles -->
    <g fill="#FFFFFF" fill-opacity=".9">
      <circle cx="218" cy="277" r="2"/>
      <circle cx="226" cy="281" r="1.5"/>
      <circle cx="379" cy="277" r="2"/>
      <circle cx="371" cy="281" r="1.5"/>
    </g>
  </g>

  <!-- Glass desk -->
  <g id="desk">
    <path d="M119 510L481 510L449 535L151 535Z"
      fill="url(#glassBody)" fill-opacity=".66" stroke="#E9FFFC" stroke-width="3"/>
    <path d="M151 535L449 535L434 553L166 553Z"
      fill="#8BE6DD" fill-opacity=".16" stroke="#CFFFF9" stroke-opacity=".75" stroke-width="2"/>
    <path d="M143 514L457 514" stroke="#FFFFFF" stroke-opacity=".88" stroke-width="3" stroke-linecap="round"/>
    <path d="M181 553L174 582M419 553L426 582"
      stroke="#B9FFF4" stroke-opacity=".65" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Laptop -->
  <g id="laptop">
    <path d="M240 423C240 416 246 410 253 410H348C355 410 361 416 361 423V489H240Z"
      fill="url(#laptopMetal)" stroke="#F3FFFF" stroke-width="3"/>
    <path d="M250 423H351V480H250Z" fill="#15313E" stroke="#A9F7F0" stroke-width="2"/>
    <rect x="258" y="431" width="85" height="41" rx="4" fill="#214A58"/>
    <path d="M269 442H312M269 450H329M269 458H305"
      stroke="#9CFFF0" stroke-width="3" stroke-linecap="round"/>
    <path d="M232 489H369L387 501C390 504 387 508 382 508H218C213 508 210 504 213 501Z"
